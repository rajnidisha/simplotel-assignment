<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Frontend Assignment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">

      <!-- Logo + Navigation -->
      <nav class="top-nav" aria-label="Main navigation">

        <!-- Hidden checkbox for CSS toggle -->
        <input type="checkbox" id="nav-toggle" class="nav-toggle">

        <!-- Hamburger Icon -->
        <label for="nav-toggle" class="hamburger">
          <img src="menu-bar.png" alt="Menu">
        </label>

        <!-- Desktop & Mobile Menu -->
        <ul class="nav-list" id="nav-list">
          <li>Home</li>
          <li>Order</li>
          <li>Food</li>
          <li>Restaurant</li>
          <li>Testimonials</li>
          <li>Contact Us</li>
        </ul>
      </nav>

    </div>
  </header>


  <main>
    <section class="hero">
      <div class="hero-inner container">
        <div class="hero-left">
          <h1>LOREM IPSUM</h1>
          <p class="lead">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus id est vitae dolor rhoncus
            tristique. Maecenas metus quam, rhoncus euismod lorem in, sollicitudin viverra eros.
          </p>
          <a class="btn cta" href="#order">Click Me</a>
        </div>

        <div class="hero-right">
          <img src="pexels-robin-stickel-70497.jpg" alt="Food Image">
        </div>
      </div>
    </section>
  </main>

</body>
</html>
